<!DOCTYPE html>
<html lang="en"> <!-- Specify the primary language as English -->
    <head>
        <title>Social Link Profile</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.google.com/specimen/Inter">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="backgroundBox">
            <main>
                <section class="mainBox">
                    <img src="avatar-jessica.jpeg" alt="Avatar Image" class="image">
                    <h1 class="headingName">Jessica Randall</h1>
                    <p class="location">London, United Kingdom</p>
                    <p class="description">"Front-end developer and avid reader."</p>
                    <button type="button" class="button">GitHub</button>
                    <button type="button" class="button">Frontend Mentor</button>
                    <button type="button" class="button">LinkedIn</button>
                    <button type="button" class="button">Twitter</button>
                    <button type="button" class="button">Instagram</button>
                </section>
            </main>
        </div>
    </body>
</html>
